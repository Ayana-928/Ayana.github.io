<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>提瓦特生日指南</title>
    <meta
      name="description"
      content="原神全角色生日倒计时一站式查询，涵盖蒙德、璃月、稻妻、须弥、枫丹、纳塔、至冬等所有地区角色生日。"
    />
    <!-- Open Graph / 社交分享 -->
    <meta property="og:title" content="提瓦特生日指南" />
    <meta
      property="og:description"
      content="原神全角色生日倒计时一站式查询，不错过每一位旅伴的生日庆典"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="提瓦特生日指南" />
    <style>
      /* ====================== 全局CSS变量定义 ====================== */
      :root {
        --primary-color: #8a5cf6;
        --primary-rgb: 138, 92, 246;
        --bg-main: #121826;
        --bg-sidebar: rgba(18, 24, 38, 0.88);
        --bg-card: rgba(30, 35, 48, 0.75);
        --card-bg: rgba(255, 255, 255, 0.08);
        --text-main: #f8fafc;
        --text-secondary: #94a3b8;
        --border-color: rgba(138, 92, 246, 0.25);
        --hover-bg: rgba(138, 92, 246, 0.1);
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        --transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        --nav-text-color: #e2e8f0;

        --container-max-width: 1400px;
        --safe-padding: 1rem;

        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-10: 2.5rem;
        --space-12: 3rem;
        --space-16: 4rem;

        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;
      }
      /* ====================== 全局基础样式重置 ====================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      html {
        overflow-x: hidden;
        scroll-behavior: smooth;
      }
      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        min-height: 100vh;
        transition: background-color 0.5s ease;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(var(--primary-rgb), 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(var(--primary-rgb), 0.5);
      }
      /* ====================== 焦点可见样式（无障碍） ====================== */
      :focus-visible {
        outline: 3px solid var(--primary-color);
        outline-offset: 2px;
      }
      .nav-item:focus-visible {
        outline-offset: -2px;
      }
      /* ====================== 侧边栏移动端遮罩层 ====================== */
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 998;
        background: transparent;
        opacity: 0;
        transition: opacity 0.3s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .sidebar-overlay.active {
        opacity: 1;
      }
      @media (max-width: 1024px) {
        .sidebar-overlay.active {
          display: block;
        }
        .sidebar.open {
          background: rgba(0, 0, 0, 0.35);
          -webkit-backdrop-filter: blur(8px);
          backdrop-filter: blur(8px);
          border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
      }
      /* ====================== 跳转链接（Skip Link） ====================== */
      .skip-link {
        position: fixed;
        top: -100%;
        left: var(--space-4);
        z-index: 10000;
        padding: var(--space-3) var(--space-6);
        background: var(--primary-color);
        color: #fff;
        font-weight: 600;
        border-radius: var(--radius-md);
        text-decoration: none;
        transition: top 0.2s ease;
      }
      .skip-link:focus {
        top: var(--space-4);
      }
      /* ====================== 汉堡按钮样式 ====================== */
      .hamburger-btn {
        position: fixed;
        top: var(--space-4);
        left: var(--space-4);
        z-index: 9999;
        width: 48px;
        height: 48px;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: var(--radius-md);
        padding: 0;
        cursor: pointer;
        color: var(--text-main);
        box-shadow: var(--shadow);
        transition: var(--transition);
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
        pointer-events: auto;
        touch-action: manipulation;
      }
      .hamburger-btn:hover {
        transform: scale(1.05);
        border-color: rgba(var(--primary-rgb), 0.7);
        box-shadow: 0 6px 16px rgba(var(--primary-rgb), 0.2);
      }
      .hamburger-btn:active {
        transform: scale(0.98);
        transition: all 0.1s ease;
      }
      .hamburger-btn.hidden {
        opacity: 0;
        visibility: hidden;
        transform: translateX(-10px);
        pointer-events: none;
      }
      .hamburger-btn svg {
        width: 22px;
        height: 22px;
      }
      .hamburger-btn svg line {
        stroke-linecap: round;
        transition: var(--transition);
      }
      /* ====================== 左侧侧边栏导航样式 ====================== */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;
        height: 100vh;
        background: var(--bg-sidebar);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border-right: 1px solid var(--border-color);
        padding: var(--space-8) 0;
        display: flex;
        flex-direction: column;
        z-index: 999;
        transition: var(--transition);
        overflow: hidden;
      }
      .sidebar-logo {
        text-align: center;
        padding: 0 var(--space-4) var(--space-8);
        border-bottom: 1px solid var(--border-color);
        margin-bottom: var(--space-4);
        flex-shrink: 0;
      }
      .sidebar-logo h2 {
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--primary-color);
        text-shadow: 0 0 10px rgba(var(--primary-rgb), 0.4);
        letter-spacing: -0.01em;
        line-height: 1.3;
      }
      .nav-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: rgba(var(--primary-rgb), 0.3) transparent;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition);
        color: var(--nav-text-color);
        border: 1px solid transparent;
        font-size: 1.05rem;
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: -0.01em;
        min-height: 48px;
        touch-action: manipulation;
      }
      .nav-item:hover {
        background: var(--hover-bg);
        color: var(--text-main);
        transform: translateX(4px);
        border-color: rgba(var(--primary-rgb), 0.15);
      }
      .nav-item.active {
        background: var(--primary-color);
        color: #ffffff;
        border-color: var(--primary-color);
        box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.35);
        font-weight: 600;
      }
      .nav-item .icon {
        font-size: 1.2rem;
        width: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .nav-item .icon svg {
        width: 1.15em;
        height: 1.15em;
        display: block;
      }
      .sidebar-footer {
        padding: var(--space-6) var(--space-4) 0;
        border-top: 1px solid var(--border-color);
        text-align: center;
        font-size: 0.8rem;
        color: var(--text-secondary);
        opacity: 0.7;
        flex-shrink: 0;
        line-height: 1.4;
      }
      /* ====================== 右侧主内容区样式 ====================== */
      .main-container {
        min-height: 100vh;
        padding: var(--space-10) var(--space-8);
        transition: var(--transition);
        max-width: var(--container-max-width);
        margin-left: 260px;
        margin-right: auto;
        width: calc(100% - 260px);
      }
      .page-panel {
        display: none;
        animation: fadeIn 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      .page-panel.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      /* ====================== 主页角色区样式 ====================== */
      .home-hero {
        min-height: 40vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: var(--space-16) var(--space-10);
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        margin-bottom: var(--space-8);
        background-image: radial-gradient(
          circle at 50% 50%,
          rgba(var(--primary-rgb), 0.18) 0%,
          transparent 70%
        );
        backdrop-filter: blur(10px);
      }
      .home-hero h1 {
        font-size: clamp(2.2rem, 5vw, 4rem);
        background: linear-gradient(90deg, #8a5cf6, #42b3bd, #e6c07a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: var(--space-6);
        letter-spacing: -0.02em;
        font-weight: 700;
        line-height: 1.2;
      }
      .home-hero p {
        font-size: clamp(1rem, 2vw, 1.2rem);
        color: var(--text-secondary);
        max-width: 700px;
        margin-bottom: var(--space-4);
        font-weight: 400;
        line-height: 1.6;
      }
      /* ====================== 板块通用标题样式 ====================== */
      .section-title {
        font-size: clamp(1.3rem, 3vw, 1.6rem);
        margin-bottom: var(--space-5);
        padding-left: var(--space-4);
        border-left: 4px solid var(--primary-color);
        color: var(--text-main);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.4;
      }
      /* ====================== 空状态提示样式 ====================== */
      .empty-tip {
        text-align: center;
        padding: var(--space-10) var(--space-6);
        color: var(--text-secondary);
        font-size: 1.1rem;
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-color);
        backdrop-filter: blur(10px);
        line-height: 1.6;
      }
      /* ====================== 角色卡片通用样式 ====================== */
      .card-grid,
      .nation-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-5);
        margin-bottom: var(--space-12);
        width: 100%;
      }
      .original-card {
        width: 100%;
        min-width: 0;
        -webkit-backdrop-filter: blur(0px);
        backdrop-filter: blur(0px);
        box-shadow: var(--shadow);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: var(--radius-lg);
        padding: var(--space-4);
        background-color: rgba(255, 255, 255, 0.1);
        transition: transform 0.3s ease;
        will-change: transform;
        transform: translateZ(0);
        display: flex;
        flex-direction: column;
      }
      .original-card img {
        margin: 0 0 var(--space-3);
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: var(--radius-md);
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        image-rendering: -webkit-optimize-contrast;
        flex-shrink: 0;
      }
      .original-card h3 {
        margin: 0 0 var(--space-2);
        font-size: clamp(1.1em, 2vw, 1.4em);
        color: #f1f5f9;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .countdown-label {
        font-size: clamp(12px, 1.5vw, 14px);
        opacity: 0.8;
        margin: 0 0 var(--space-1);
        color: #cbd5e1;
        line-height: 1.4;
      }
      .countdown-time {
        font-weight: bold;
        font-size: clamp(1em, 2vw, 1.1em);
        margin: 0;
        margin-top: auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
        color: #f1f5f9;
        line-height: 1.4;
      }
      .today-card .countdown-time {
        color: #ff6b6b;
        font-size: clamp(1.1em, 2.2vw, 1.2em);
      }
      /* ====================== 地区页面通用样式 ====================== */
      .nation-header {
        text-align: center;
        margin-bottom: var(--space-8);
        padding-top: var(--space-2);
      }
      .nation-title {
        font-size: clamp(1.8em, 4vw, 2.4em);
        margin: 0;
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.3;
      }
      .time-display {
        font-size: clamp(0.9em, 1.8vw, 1.1em);
        opacity: 0.8;
        margin-top: var(--space-2);
        color: var(--text-secondary);
        line-height: 1.4;
      }
      .nation-footer {
        text-align: center;
        margin-top: var(--space-10);
        opacity: 0.6;
        font-size: 14px;
        color: var(--text-secondary);
        line-height: 1.4;
      }
      /* ====================== 全局页脚样式 ====================== */
      footer {
        text-align: center;
        padding: var(--space-8);
        opacity: 0.6;
        font-size: 14px;
        margin-top: var(--space-10);
        border-top: 1px solid var(--border-color);
        color: var(--text-secondary);
        line-height: 1.4;
      }
      /* ====================== 响应式适配 ====================== */
      @media (min-width: 1600px) {
        :root {
          --container-max-width: 1600px;
        }
        .card-grid,
        .nation-grid {
          gap: var(--space-6);
        }
        .original-card {
          padding: var(--space-5);
        }
      }
      @media (max-width: 1024px) {
        .hamburger-btn {
          display: flex;
        }
        .sidebar {
          left: -260px;
        }
        .sidebar.open {
          left: 0;
        }
        .main-container {
          margin-left: 0;
          margin-right: 0;
          width: 100%;
          padding: 5rem var(--safe-padding) var(--space-8);
        }
        .home-hero {
          padding: 2.5rem 1.5rem;
          min-height: 30vh;
          margin-bottom: var(--space-6);
        }
        .card-grid,
        .nation-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: var(--space-4);
          margin-bottom: var(--space-10);
        }
        .original-card {
          padding: var(--space-3);
        }
      }
      @media (max-width: 640px) {
        .card-grid,
        .nation-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: var(--space-3);
          margin-bottom: var(--space-8);
        }
      }
      @media (max-width: 480px) {
        :root {
          --safe-padding: 0.75rem;
        }
        .main-container {
          padding: 4.5rem var(--safe-padding) 1.5rem;
        }
        .home-hero {
          padding: 2rem 1rem;
          border-radius: 16px;
          margin-bottom: var(--space-5);
          min-height: 25vh;
        }
        .section-title {
          margin-bottom: var(--space-4);
          padding-left: 0.75rem;
        }
        .card-grid,
        .nation-grid {
          grid-template-columns: 1fr;
          gap: var(--space-3);
          margin-bottom: var(--space-6);
        }
        .original-card {
          padding: var(--space-3);
          border-radius: 12px;
          max-width: 100%;
        }
        .original-card img {
          border-radius: 8px;
          margin: 0 0 var(--space-2);
        }
        .original-card h3 {
          margin: 0 0 var(--space-1);
        }
        .empty-tip {
          padding: var(--space-6) var(--space-4);
          border-radius: 12px;
        }
        footer {
          padding: var(--space-6);
          margin-top: var(--space-8);
        }
      }
      @media (max-width: 360px) {
        .hamburger-btn {
          width: 44px;
          height: 44px;
          top: 0.75rem;
          left: 0.75rem;
        }
        .main-container {
          padding: 4rem var(--safe-padding) 1rem;
        }
        .original-card {
          padding: var(--space-2);
        }
      }
      @media (max-height: 500px) and (orientation: landscape) {
        .sidebar {
          padding: 1rem 0;
        }
        .sidebar-logo {
          padding: 0 1rem 1rem;
          margin-bottom: 0.5rem;
        }
        .nav-item {
          min-height: 40px;
          padding: 0.6rem 0.9rem;
        }
        .main-container {
          padding: 4rem 1rem 1.5rem;
        }
        .home-hero {
          min-height: 25vh;
          padding: 1.5rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">跳转到主内容</a>
    <button
      class="hamburger-btn"
      id="hamburgerBtn"
      aria-label="打开导航菜单"
      aria-expanded="false"
      aria-controls="sidebar"
      type="button"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside
      class="sidebar"
      id="sidebar"
      role="complementary"
      aria-label="地区导航菜单"
    >
      <div class="sidebar-logo">
        <h2>提瓦特生日指南</h2>
      </div>
      <nav
        class="nav-list"
        id="navList"
        role="navigation"
        aria-label="地区列表"
      >
        <div class="nav-item active" data-hash="home">
          <span class="icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
              <path
                d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
              />
            </svg>
          </span>
          <span>主页</span>
        </div>
      </nav>
      <div class="sidebar-footer">
        <p>© 2026 by Ayash1mo</p>
      </div>
    </aside>
    <main class="main-container" id="main-content">
      <section
        class="page-panel active"
        id="home-panel"
        role="tabpanel"
        aria-label="主页"
      >
        <div class="home-hero">
          <h1>提瓦特生日倒计时</h1>
          <p>全地区角色生日一站式查询，不错过每一位旅伴的生日庆典</p>
          <p class="time-display" id="home-realTime" aria-live="polite">
            加载中...
          </p>
        </div>
        <div class="today-birthday">
          <h2 class="section-title">🎉 今天过生日的角色</h2>
          <div
            class="card-grid"
            id="todayBirthdayGrid"
            aria-live="polite"
          ></div>
        </div>
        <div class="upcoming-birthday">
          <h2 class="section-title">📅 未来15天内即将到来的生日</h2>
          <div
            class="card-grid"
            id="upcomingBirthdayGrid"
            aria-live="polite"
          ></div>
        </div>
      </section>
      <section
        class="page-panel"
        id="mondstadt-panel"
        role="tabpanel"
        aria-label="蒙德"
      >
        <div class="nation-container">
          <div class="nation-header">
            <h1 class="nation-title">蒙德</h1>
            <p class="time-display" id="mondstadt-realTime" aria-live="polite">
              加载中...
            </p>
          </div>
          <div class="nation-grid" id="mondstadt-characterGrid"></div>
        </div>
      </section>
      <section
        class="page-panel"
        id="liyue-panel"
        role="tabpanel"
        aria-label="璃月"
      >
        <div class="nation-container">
          <div class="nation-header">
            <h1 class="nation-title">璃月</h1>
            <p class="time-display" id="liyue-realTime">加载中...</p>
          </div>
          <div class="nation-grid" id="liyue-characterGrid"></div>
        </div>
      </section>
      <section
        class="page-panel"

      let lastHomeRenderDate = new Date().toDateString();

      // ====================== 通用工具函数 ======================
      function formatTime(date) {
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const hour = String(date.getHours()).padStart(2, "0");
        const minute = String(date.getMinutes()).padStart(2, "0");
        const second = String(date.getSeconds()).padStart(2, "0");
        const weekdays = [
          "星期日",
          "星期一",
          "星期二",
          "星期三",
          "星期四",
          "星期五",
          "星期六",
        ];
        const weekday = weekdays[date.getDay()];
        return `${year}年${month}月${day}日 ${weekday} ${hour}:${minute}:${second}`;
      }

      function isLeapYear(year) {
        return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
      }

      // 还原：移除2月29日特殊文案
      function getCountdownDetail(birthdayStr) {
        const [bMonth, bDay] = birthdayStr.split("-").map(Number);
        const now = new Date();
        const currentYear = now.getFullYear();
        const todayMonth = now.getMonth() + 1;
        const todayDay = now.getDate();
        let nextBirthday;
        let isBirthdayToday = false;

        if (bMonth === 2 && bDay === 29) {
          isBirthdayToday = todayMonth === 2 && todayDay === 29;
        } else {
          isBirthdayToday = bMonth === todayMonth && bDay === todayDay;
        }

        if (bMonth === 2 && bDay === 29) {
          if (isBirthdayToday) {
            nextBirthday = new Date(currentYear, 1, 29);
          } else if (isLeapYear(currentYear)) {
            nextBirthday = new Date(currentYear, 1, 29);
            if (nextBirthday < now) {
              let nextLeapYear = currentYear + 1;
              while (!isLeapYear(nextLeapYear)) nextLeapYear++;
              nextBirthday = new Date(nextLeapYear, 1, 29);
            }
          } else {
            let nextLeapYear = currentYear + 1;
            while (!isLeapYear(nextLeapYear)) nextLeapYear++;
            nextBirthday = new Date(nextLeapYear, 1, 29);
          }
        } else {
          if (isBirthdayToday) {
            nextBirthday = new Date(currentYear, bMonth - 1, bDay);
          } else {
            nextBirthday = new Date(currentYear, bMonth - 1, bDay);
            if (nextBirthday < now) {
              nextBirthday.setFullYear(currentYear + 1);
            }
          }
        }

        const diffMs = nextBirthday - now;
        const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
        const isToday = isBirthdayToday;
        const isWithin15Days = diffDays <= 15 && diffDays > 0;

        let countdownText;
        if (isToday) {
          countdownText = "就是今天🎉";
        } else {
          const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
          const hours = Math.floor(
            (diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
          );
          const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diffMs % (1000 * 60)) / 1000);
          countdownText = `${days}天${hours}小时${minutes}分钟${seconds}秒`;
        }

        return {
          days: diffDays,
          isToday: isToday,
          isWithin15Days: isWithin15Days,
          countdownText: countdownText,
          date: `${bMonth}月${bDay}日`,
          nextBirthday: nextBirthday,
        };
      }

      function formatBirthdayMMDD(birthdayStr) {
        const [month, day] = birthdayStr
          .split("-")
          .map((num) => num.padStart(2, "0"));
        return `${month}-${day}`;
      }

      function isTouchDevice() {
        return "ontouchstart" in window || navigator.maxTouchPoints > 0;
      }

      function initCardInteraction(containerSelector = "") {
        // 触屏设备关闭 3D 倾斜，避免干扰触摸滚动
        if (isTouchDevice()) return;

        const elements = document.querySelectorAll(
          `${containerSelector} .original-card, ${containerSelector} .card`,
        );
        const sensitivity = 40;

        elements.forEach((element) => {
          element.removeEventListener("mousemove", handleMouseMove);
          element.removeEventListener("mouseleave", handleMouseLeave);
          element.removeEventListener("mouseenter", handleMouseEnter);
          element.addEventListener("mousemove", handleMouseMove);
          element.addEventListener("mouseleave", handleMouseLeave);
          element.addEventListener("mouseenter", handleMouseEnter);
        });

        function handleMouseMove(e) {
          const rect = e.currentTarget.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const relativeX = x / rect.width - 0.5;
          const relativeY = y / rect.height - 0.5;
          const rotateY = relativeX * sensitivity;
          const rotateX = -relativeY * sensitivity;
          e.currentTarget.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
        }

        function handleMouseLeave(e) {
          e.currentTarget.style.transform =
            "perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)";
        }

        function handleMouseEnter(e) {
          e.currentTarget.style.transform =
            "perspective(1000px) rotateX(0) rotateY(0) scale3d(1.05, 1.05, 1.05)";
        }
      }

      function hexToRgbValues(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return { r, g, b };
      }

      function setTheme(nation) {
        const root = document.documentElement;
        if (!nation) {
          root.style.setProperty("--primary-color", "#8A5CF6");
          root.style.setProperty("--primary-rgb", "138, 92, 246");
          root.style.setProperty("--bg-main", "#121826");
          root.style.setProperty("--bg-sidebar", "rgba(18, 24, 38, 0.88)");
          root.style.setProperty("--bg-card", "rgba(30, 35, 48, 0.75)");
          root.style.setProperty("--card-bg", "rgba(255, 255, 255, 0.08)");
          root.style.setProperty("--text-main", "#F8FAFC");
          root.style.setProperty("--text-secondary", "#94A3B8");
          root.style.setProperty("--border-color", "rgba(138, 92, 246, 0.25)");
          root.style.setProperty("--hover-bg", "rgba(138, 92, 246, 0.1)");
          root.style.setProperty("--shadow", "0 4px 20px rgba(0, 0, 0, 0.4)");
          root.style.setProperty("--nav-text-color", "#E2E8F0");
          return;
        }
        const { r, g, b } = hexToRgbValues(nation.bg);
        const primaryRgb = hexToRgbValues(nation.primary);
        const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
        const isLightBackground = luminance > 128;
        root.style.setProperty("--primary-color", nation.primary);
        root.style.setProperty(
          "--primary-rgb",
          `${primaryRgb.r}, ${primaryRgb.g}, ${primaryRgb.b}`,
        );
        root.style.setProperty("--bg-main", nation.bg);
        root.style.setProperty("--bg-sidebar", `rgba(${r}, ${g}, ${b}, 0.88)`);
        root.style.setProperty("--bg-card", "rgba(30, 35, 48, 0.75)");
        root.style.setProperty("--card-bg", "rgba(255, 255, 255, 0.08)");

        if (isLightBackground) {
          root.style.setProperty("--text-main", "#0f172a");
          root.style.setProperty("--text-secondary", "#334155");
          root.style.setProperty("--nav-text-color", "#1e293b");
          root.style.setProperty("--bg-card", "rgba(255, 255, 255, 0.8)");
          root.style.setProperty("--card-bg", "rgba(0, 0, 0, 0.05)");
          root.style.setProperty("--border-color", "rgba(0, 0, 0, 0.1)");
          root.style.setProperty("--hover-bg", "rgba(0, 0, 0, 0.06)");
          root.style.setProperty("--shadow", "0 4px 20px rgba(0, 0, 0, 0.1)");
        } else {
          root.style.setProperty("--text-main", "#f1f5f9");
          root.style.setProperty("--text-secondary", "#cbd5e1");
          root.style.setProperty("--nav-text-color", "#e2e8f0");
          root.style.setProperty("--bg-card", "rgba(30, 41, 59, 0.8)");
          root.style.setProperty("--card-bg", "rgba(255, 255, 255, 0.08)");
          root.style.setProperty(
            "--border-color",
            `rgba(${r}, ${g}, ${b}, 0.3)`,
          );
          root.style.setProperty("--hover-bg", "rgba(255, 255, 255, 0.08)");
          root.style.setProperty("--shadow", "0 4px 20px rgba(0, 0, 0, 0.3)");
        }
      }

      // ====================== 页面渲染函数 ======================
      function renderTodayBirthday() {
        const container = document.getElementById("todayBirthdayGrid");
        const todayRoles = allRoleList.filter((role) => {
          const detail = getCountdownDetail(role.birthday);
          return detail.isToday;
        });
        if (todayRoles.length === 0) {
          container.innerHTML =
            '<div class="empty-tip">今天暂无角色过生日，快去看看即将到来的生日吧~</div>';
          return;
        }
        container.innerHTML = "";
        todayRoles.forEach((role) => {
          const formattedBirthday = formatBirthdayMMDD(role.birthday);
          const card = document.createElement("article");
          card.className = "original-card today-card";
          card.innerHTML = `
                    <img src="${role.image}" alt="${role.name}" loading="lazy" decoding="async">
                    <h3>${role.name} ${formattedBirthday}</h3>
                    <div class="countdown-label">距离生日</div>
                    <div class="countdown-time" data-birthday="${role.birthday}">就是今天🎉</div>
                `;
          container.appendChild(card);
        });
        initCardInteraction("#todayBirthdayGrid");
      }

      function renderUpcomingBirthday() {
        const container = document.getElementById("upcomingBirthdayGrid");
        const upcomingRoles = allRoleList
          .filter((role) => {
            const detail = getCountdownDetail(role.birthday);
            return detail.isWithin15Days;
          })
          .sort((a, b) => {
            return (
              getCountdownDetail(a.birthday).days -
              getCountdownDetail(b.birthday).days
            );
          });
        if (upcomingRoles.length === 0) {
          container.innerHTML =
            '<div class="empty-tip">未来15天暂无角色生日</div>';
          return;
        }
        container.innerHTML = "";
        upcomingRoles.forEach((role) => {
          const formattedBirthday = formatBirthdayMMDD(role.birthday);
          const detail = getCountdownDetail(role.birthday);
          const card = document.createElement("article");
          card.className = "original-card";
          card.innerHTML = `
                    <img src="${role.image}" alt="${role.name}" loading="lazy" decoding="async">
                    <h3>${role.name} ${formattedBirthday}</h3>
                    <div class="countdown-label">距离生日还有</div>
                    <div class="countdown-time" data-birthday="${role.birthday}">${detail.countdownText}</div>
                `;
          container.appendChild(card);
        });
        initCardInteraction("#upcomingBirthdayGrid");
      }

      function renderNavList() {
        const navList = document.getElementById("navList");
        nationList.forEach((nation) => {
          const navItem = document.createElement("div");
          navItem.className = "nav-item";
          navItem.setAttribute("data-hash", nation.hash);
          navItem.innerHTML = `
                    <span class="icon">${nationIcons[nation.hash] || ""}</span>
                    <span>${nation.name}</span>
                `;
          navList.appendChild(navItem);
        });
      }

      // ====================== 地区模块工厂函数 ======================
      function createNationModule(nationKey, characters) {
        return {
          characters: characters,
          preloadImages() {
            this.characters.forEach((char) => {
              const img = new Image();
              img.src = char.image;
            });
          },
          updateRealTime() {
            const now = new Date();
            document.getElementById(`${nationKey}-realTime`).textContent =
              formatTime(now);
          },
          renderCharacters(list = this.characters) {
            const container = document.getElementById(
              `${nationKey}-characterGrid`,
            );
            container.innerHTML = "";
            list.forEach((char, index) => {
              const card = document.createElement("article");
              card.className = "card original-card glass-item";
              card.dataset.name = char.name.toLowerCase();
              if (char.birthday === "???") {
                card.innerHTML = `
                                <img src="${char.image}" alt="${char.name}" loading="lazy" decoding="async">
                                <h3>${char.name}</h3>
                                <div class="countdown-time">${char.note || "生日未知"}</div>
                            `;
                container.appendChild(card);
                return;
              }
              const formattedBirthday = formatBirthdayMMDD(char.birthday);
              const isToday = getCountdownDetail(char.birthday).isToday;
              const countdownText = getCountdownDetail(
                char.birthday,
              ).countdownText;
              card.innerHTML = `
                            <img src="${char.image}" alt="${char.name}" loading="lazy" decoding="async">
                            <h3>${char.name} ${formattedBirthday}</h3>
                            <div class="countdown-label">距离生日还有</div>
                            <div class="countdown-time" data-index="${index}">${countdownText}</div>
                        `;
              if (isToday) card.classList.add("today-card");
              container.appendChild(card);
            });
            initCardInteraction(`#${nationKey}-panel`);
          },
          updateCountdowns() {
            this.characters.forEach((char, index) => {
              const countdownEl = document.querySelector(
                `#${nationKey}-panel .countdown-time[data-index="${index}"]`,
              );
              if (!countdownEl) return;

              if (char.birthday === "???") {
                countdownEl.textContent = char.note || "生日未知";
                return;
              }

              countdownEl.textContent = getCountdownDetail(
                char.birthday,
              ).countdownText;
              const card = countdownEl.closest(".card");
              if (getCountdownDetail(char.birthday).isToday) {
                card.classList.add("today-card");
              } else {
                card.classList.remove("today-card");
              }
            });
          },
          init() {
            this.preloadImages();
            this.updateRealTime();
            this.renderCharacters();
          },
        };
      }

      // ====================== 地区模块初始化 ======================
      const mondstadtModule = createNationModule(
        "mondstadt",
        allRoleList.filter((role) => role.nation === "蒙德"),
      );
      const liyueModule = createNationModule(
        "liyue",
        allRoleList.filter((role) => role.nation === "璃月"),
      );
      const inazumaModule = createNationModule(
        "inazuma",
        allRoleList.filter((role) => role.nation === "稻妻"),
      );
      const sumeruModule = createNationModule(
        "sumeru",
        allRoleList.filter((role) => role.nation === "须弥"),
      );
      const fontaineModule = createNationModule(
        "fontaine",
        allRoleList.filter((role) => role.nation === "枫丹"),
      );
      const natlanModule = createNationModule(
        "natlan",
        allRoleList.filter((role) => role.nation === "纳塔"),
      );
      const snezhnayaModule = createNationModule(
        "snezhnaya",
        allRoleList.filter((role) => role.nation === "至冬"),
      );
      const nodkraiModule = createNationModule(
        "nodkrai",
        allRoleList.filter((role) => role.nation === "挪德卡莱"),
      );
      const beyondtheworldModule = createNationModule(
        "beyondtheworld",
        allRoleList.filter((role) => role.nation === "其他"),
      );

      const allModules = {
        mondstadt: mondstadtModule,
        liyue: liyueModule,
        inazuma: inazumaModule,
        sumeru: sumeruModule,
        fontaine: fontaineModule,
        natlan: natlanModule,
        snezhnaya: snezhnayaModule,
        nodkrai: nodkraiModule,
        beyondtheworld: beyondtheworldModule,
      };

      // ====================== 路由处理函数 ======================
      function handleRoute() {
        const hash = window.location.hash.slice(1) || "home";
        const navItems = document.querySelectorAll(".nav-item");
        const pagePanels = document.querySelectorAll(".page-panel");
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebar = document.getElementById("sidebar");

        navItems.forEach((item) => item.classList.remove("active"));
        pagePanels.forEach((panel) => panel.classList.remove("active"));

        const activeNavItem = document.querySelector(
          `.nav-item[data-hash="${hash}"]`,
        );
        if (activeNavItem) activeNavItem.classList.add("active");

        if (hash === "home") {
          document.getElementById("home-panel").classList.add("active");
          setTheme(null);
          document.title = "原神角色生日倒计时 - 提瓦特全地区";
          renderTodayBirthday();
          renderUpcomingBirthday();
          lastHomeRenderDate = new Date().toDateString();
        } else {
          const targetNation = nationList.find(
            (nation) => nation.hash === hash,
          );
          if (targetNation) {
            document.getElementById(`${hash}-panel`).classList.add("active");
            setTheme(targetNation);
            if (allModules[hash]) allModules[hash].init();
            document.title = `${targetNation.name}角色生日倒计时`;
          } else {
            window.location.hash = "home";
          }
        }

        sidebar.classList.remove("open");
        hamburgerBtn.classList.remove("hidden");
      }

      // ====================== 移动端侧边栏交互 ======================
      function initMobileSidebar() {
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebarOverlay");
        const mainContainer = document.querySelector(".main-container");
        const navList = document.getElementById("navList");

        function toggleSidebar(open) {
          const isOpen =
            open !== undefined ? open : !sidebar.classList.contains("open");
          sidebar.classList.toggle("open", isOpen);
          overlay.classList.toggle("active", isOpen);
          hamburgerBtn.classList.toggle("hidden", isOpen);
          hamburgerBtn.setAttribute("aria-expanded", isOpen);
          hamburgerBtn.setAttribute(
            "aria-label",
            isOpen ? "关闭导航菜单" : "打开导航菜单",
          );
          document.body.style.overflow = isOpen ? "hidden" : "";
        }

        hamburgerBtn.addEventListener("click", () => toggleSidebar());

        overlay.addEventListener("click", () => toggleSidebar(false));

        navList.addEventListener("click", (e) => {
          if (e.target.closest(".nav-item") && window.innerWidth <= 1024) {
            toggleSidebar(false);
          }
        });

        mainContainer.addEventListener("click", () => {
          if (sidebar.classList.contains("open") && window.innerWidth <= 1024) {
            toggleSidebar(false);
          }
        });

        window.addEventListener("resize", () => {
          if (window.innerWidth > 1024) {
            if (sidebar.classList.contains("open")) toggleSidebar(false);
            hamburgerBtn.classList.add("hidden");
          } else {
            if (!sidebar.classList.contains("open")) {
              hamburgerBtn.classList.remove("hidden");
            }
          }
        });
      }

      // ====================== 全局初始化 ======================
      renderNavList();
      initMobileSidebar();

      document.addEventListener("click", (e) => {
        const navItem = e.target.closest(".nav-item");
        if (navItem) {
          const hash = navItem.getAttribute("data-hash");
          window.location.hash = hash;
        }
      });

      window.addEventListener("hashchange", handleRoute);

      window.addEventListener("load", () => {
        handleRoute();
        // 删除重复的全局图片预加载，改为按需预加载
      });

      // ====================== 全局定时器 ======================
      setInterval(() => {
        const now = new Date();
        const currentDateStr = now.toDateString();
        const formattedTime = formatTime(now);

        const activePanel = document.querySelector(".page-panel.active");
        if (activePanel) {
          const timeEl = document.getElementById(
            `${activePanel.id.replace("-panel", "")}-realTime`,
          );
          if (timeEl) timeEl.textContent = formattedTime;

          if (activePanel.id !== "home-panel") {
            const nationKey = activePanel.id.replace("-panel", "");
            if (allModules[nationKey]) {
              allModules[nationKey].updateCountdowns();
            }
          } else {
            const countdownElements = document.querySelectorAll(
              "#home-panel .countdown-time[data-birthday]",
            );
            countdownElements.forEach((el) => {
              const birthday = el.getAttribute("data-birthday");
              const detail = getCountdownDetail(birthday);
              el.textContent = detail.countdownText;
              const card = el.closest(".original-card");
              if (detail.isToday) {
                card.classList.add("today-card");
              } else {
                card.classList.remove("today-card");
              }
            });

            // 跨天自动刷新
            if (currentDateStr !== lastHomeRenderDate) {
              renderTodayBirthday();
              renderUpcomingBirthday();
              lastHomeRenderDate = currentDateStr;
            }
          }
        }
      }, 1000);
    </script>
  </body>
</html>
